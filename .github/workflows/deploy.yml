name: Deploy React App to Vercel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Grocery-Ecommerce-website-with-Reactjs-/groceria-wa  # App subdirectory
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js (v18)
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: 'Grocery-Ecommerce-website-with-Reactjs-/groceria-wa/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build React app
      run: npm run build  # Uses react-scripts build per package.json
      
    - name: Test build output
      run: |
        if [ -d "dist" ]; then echo "✅ Vite build successful (dist/)"; ls -la dist/; fi
        if [ -d "build" ]; then echo "✅ CRA build successful (build/)"; ls -la build/; fi

